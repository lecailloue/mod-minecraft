name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee build.log
      - name: Self test (serveur)
        id: selftest
        if: steps.build.outcome == 'success' && hashFiles('SELFTEST') != ''
        run: |
          set -o pipefail
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "max-tick-time=-1\nlevel-seed=20261111\nonline-mode=false\nspawn-protection=0\n" > run/server.properties
          timeout 25m gradle runServer -Pselftest --stacktrace 2>&1 | tee selftest.log
          grep -q "RESULTAT: OK" selftest.log
      - name: Test client (captures d'ecran)
        id: clienttest
        if: steps.build.outcome == 'success' && hashFiles('CLIENTTEST') != ''
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick libgl1-mesa-dri > /dev/null
          rm -rf run/saves run/screenshots
          mkdir -p run
          printf "onboardAccessibility:false\ntutorialStep:none\nrenderDistance:12\nsimulationDistance:8\nnarrator:0\nsoundCategory_master:0.0\njoinedFirstServer:true\nskipMultiplayerWarning:true\npauseOnLostFocus:false\nmaxFps:60\ngraphicsMode:0\nenableVsync:false\nguiScale:2\nfullscreen:false\noverrideWidth:1280\noverrideHeight:720\nrenderClouds:\"false\"\n" > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          set -o pipefail
          timeout 28m xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient -Pclienttest 2>&1 | tail -n 400 | tee clienttest.log || true
          mkdir -p shots
          if ls run/screenshots/*.png > /dev/null 2>&1; then
            for f in run/screenshots/*.png; do convert "$f" -resize 1024x576 -quality 84 "shots/$(basename "${f%.png}").jpg"; done
          fi
          ls shots | wc -l
      - name: Publier les resultats
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || true
          tail -c 600000 selftest.log > /tmp/out/selftest.log 2>/dev/null || true
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          cp -r run/selftest /tmp/out/selftest 2>/dev/null || true
          cp run/logs/latest.log /tmp/out/server-latest.log 2>/dev/null || true
          cp -r run/crash-reports /tmp/out/crash-reports 2>/dev/null || true
          cp -r shots /tmp/out/shots 2>/dev/null || true
          grep -E "CLIENTTEST|ERROR|WARN" run/logs/latest.log 2>/dev/null | grep -v "Unprimed" | head -c 300000 > /tmp/out/client.log || true
          cp clienttest.log /tmp/out/ 2>/dev/null || true
          echo "${{ github.sha }}" > /tmp/out/COMMIT
          echo "build=${{ steps.build.outcome }} selftest=${{ steps.selftest.outcome }}" > /tmp/out/STATUS
          cd /tmp/out
          git init -q -b ci-results-morgul
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI results for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results-morgul
