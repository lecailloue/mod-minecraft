plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.112'
}

version = mod_version
group = 'net.ringsofash'
base { archivesName = 'anneaux-de-cendre-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            if (project.hasProperty('clienttest')) {
                systemProperty 'roa.clienttest', 'true'
            }
        }
        server {
            server()
            programArgument '--nogui'
            if (project.hasProperty('selftest')) {
                systemProperty 'roa.selftest', 'true'
            }
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '2000', '-Xlint:-deprecation', '-Xlint:-removal']
}
